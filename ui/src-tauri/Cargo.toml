[package]
name = "bookflow-desktop"
version = "0.8.0-rc.2"
description = "Bookflow Scholar desktop publishing client"
authors = ["Bookflow"]
edition = "2021"

[lib]
name = "bookflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

name: User problem / 使用问题
description: Report a reproducible Bookflow Scholar problem in any supported language.
title: "[Problem] "
labels:
  - user-report
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Bookflow Scholar.
        请勿粘贴 API Key、Authorization Header、机密原文、私人路径或个人信息。
        Do not paste API keys, authorization headers, confidential source content, private paths, or personal information.
  - type: dropdown
    id: language
    attributes:
      label: Preferred language / 首选语言
      options:
        - 简体中文
        - English
        - Français
        - Deutsch
        - 日本語
        - Español
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bookflow Scholar version
      placeholder: 0.8.0-rc.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - Installer / 安装版
        - Portable ZIP / 免安装版
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem summary / 问题概述
      description: What failed, and at which stage?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Create a project...
        2. Import a PDF...
        3. Select Start...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
    validations:
      required: true
  - type: textarea
    id: safe_diagnostics
    attributes:
      label: Sanitized diagnostics / 脱敏诊断
      description: Add only sanitized error text, page count, language pair, and provider/model names. Never include keys or confidential document text.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I removed API keys, authorization headers, confidential text, private paths, and personal information.
          required: true
